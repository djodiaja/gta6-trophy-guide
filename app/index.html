<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Trophy Log: GTA VI trophy guide and tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Leonida Trophy Log</h1>
    <p>Offline guide and tracker for all 55 GTA VI PS5 trophies</p>
  </div>
  <div id="overall" class="overall"></div>
  <div id="grades" class="grades"></div>
</header>
<nav class="tabs" id="tabs">
  <button data-view="checklist" class="on">Checklist</button>
  <button data-view="roadmap">Roadmap to platinum</button>
  <button data-view="missables">Missables</button>
  <span class="spacer"></span>
  <label class="toggle"><input type="checkbox" id="spoiler"> Hide story spoilers</label>
  <button id="export" type="button">Export</button>
  <label class="btn">Import<input id="import" type="file" accept="application/json" hidden></label>
</nav>
<main id="main" class="layout">
  <section id="listPane" class="pane"></section>
  <aside id="detail" class="detail"></aside>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
