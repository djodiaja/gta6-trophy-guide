<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Trophy Log: GTA VI guide and tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Leonida Trophy Log</h1>
    <p>Offline guide and tracker for all 55 GTA VI PS5 trophies</p>
  </div>
  <div class="overall">
    <div class="overall-num"><b id="overall-count">0</b><span> / 55 earned</span></div>
    <div class="bar big"><i id="overall-bar"></i></div>
  </div>
  <div id="grade-bars" class="grades"></div>
</header>

<nav class="tabs" id="tabs">
  <button data-view="checklist" class="on" type="button">Checklist</button>
  <button data-view="roadmap" type="button">Roadmap to platinum</button>
  <button data-view="missables" type="button">Missables</button>
  <span class="spacer"></span>
  <label class="toggle"><input type="checkbox" id="spoiler"> Hide story spoilers</label>
  <button id="export" type="button" class="ghost">Export</button>
  <label class="ghost filebtn">Import<input id="import" type="file" accept="application/json" hidden></label>
</nav>

<main id="view-checklist" class="view">
  <section class="list-col">
    <div class="filters">
      <div id="kind-chips" class="chips"></div>
      <div class="row">
        <select id="grade" aria-label="Grade">
          <option value="all">All grades</option><option value="platinum">Platinum</option><option value="gold">Gold</option><option value="silver">Silver</option><option value="bronze">Bronze</option>
        </select>
        <select id="status" aria-label="Status"><option value="all">All</option><option value="todo">To do</option><option value="done">Earned</option></select>
        <input id="search" type="search" placeholder="Search name or description" aria-label="Search">
      </div>
      <p id="result-note" class="note"></p>
    </div>
    <ul id="rows" class="rows"></ul>
  </section>
  <aside id="detail" class="detail" aria-live="polite"></aside>
</main>

<main id="view-roadmap" class="view page" hidden></main>
<main id="view-missables" class="view page" hidden></main>

<footer>Names, descriptions and grades are the official PlayStation list. Guides are written for this app and cite their sources. Progress stays in this browser. Not affiliated with Rockstar Games.</footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
